[project]
name = "tickerwatch"
version = "0.1.0"
description = "TickerWatch - Local-First Financial Intelligence Ingestion Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "pyyaml>=6.0.2",
    "python-dateutil>=2.9.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.0",
    "huggingface-hub>=0.23.0",
    "truststore>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: Live external integration tests requiring real outbound network access (opt-in only via pytest -m live)",
]
addopts = "-m 'not live'"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]
